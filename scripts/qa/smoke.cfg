echo AC3DS_QA BEGIN smoke
sleep 2000 [
    closecurmenu
    echo AC3DS_QA STARTUP (curmap) $gamemode (player1 cn)
    if (&& (strcmp (curmap) ac_desert) (>= (player1 cn) 0)) [ echo AC3DS_QA PASS startup ] [ echo AC3DS_QA FAIL startup ]
    mapstartonce = [
        sleep 1000 [
            addnbot 6 random good
            echo AC3DS_QA BOT_MATCH (curmap) $gamemode (player1 health) (curweapon)
            if (&& (strcmp (curmap) ac_desert) (= $gamemode 8)) [ echo AC3DS_QA PASS bot_map ] [ echo AC3DS_QA FAIL bot_map ]
            sleep 3000 [ ac3dsstats; screenshot qa_smoke; mapshot ] 1
            sleep 9000 [ echo AC3DS_QA END smoke; quit ] 1
        ] 1
    ]
    mode 8
    map ac_desert
] 1
sleep 45000 [ echo AC3DS_QA TIMEOUT smoke; quit ] 1
