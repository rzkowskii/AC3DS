echo AC3DS_QA BEGIN edit
sleep 2000 [
    closecurmenu
    edittoggle
    newmap 7
    if (! $editing) [ edittoggle ]
    echo AC3DS_QA EDIT_STATE $editing (mapsize)
    if (&& $editing (= (mapsize) 7)) [ echo AC3DS_QA PASS new_map ] [ echo AC3DS_QA FAIL new_map ]
    gotoposition 22 20 12 0 10
    select 24 24 4 4
    tempalias qa_before (undolevel)
    editheight 0 2
    tempalias qa_after (undolevel)
    if (= $qa_after (+ $qa_before 1)) [ echo AC3DS_QA PASS edit_height ] [ echo AC3DS_QA FAIL edit_height ]
    undo
    if (= (undolevel) $qa_before) [ echo AC3DS_QA PASS edit_undo ] [ echo AC3DS_QA FAIL edit_undo ]
    redo
    if (= (undolevel) $qa_after) [ echo AC3DS_QA PASS edit_redo ] [ echo AC3DS_QA FAIL edit_redo ]
    xmap_store qa_editor
    if (strcmp (at (getxmaplist) 0) qa_editor) [ echo AC3DS_QA PASS edit_xmap ] [ echo AC3DS_QA FAIL edit_xmap ]
    savemap qa_editor
    sleep 2000 [
        screenshot qa_editor
        mapshot
        tempalias qa_reload (loadmap qa_editor)
        echo AC3DS_QA LOAD_STATUS $qa_reload
        if (&& (= $qa_reload 0) (strcmp (curmap) qa_editor)) [ echo AC3DS_QA PASS reload_map ] [ echo AC3DS_QA FAIL reload_map ]
        sleep 1500 [ echo AC3DS_QA END edit; quit ] 1
    ] 1
] 1
sleep 30000 [ echo AC3DS_QA TIMEOUT edit; quit ] 1
