echo AC3DS_QA BEGIN hid
showscoresondeath 0
tempalias qa_hid_x 0
tempalias qa_hid_y 0

// The original KEYPRESS hook supplies its name before the key code.
KEYPRESS = [
    echo AC3DS_QA HID_DOWN (findkey $arg2)
    if (= $arg2 (findkeycode 3DS_CPAD_UP)) [
        qa_hid_x = (player1 x)
        qa_hid_y = (player1 y)
        echo AC3DS_QA HID_POSITION before $qa_hid_x $qa_hid_y
    ]
]
KEYRELEASE = [
    echo AC3DS_QA HID_UP (findkey $arg1)
    if (= $arg1 (findkeycode 3DS_CPAD_UP)) [
        echo AC3DS_QA HID_POSITION after (player1 x) (player1 y)
        if (|| (!=f $qa_hid_x (player1 x)) (!=f $qa_hid_y (player1 y))) [
            echo AC3DS_QA PASS hid_movement
        ]
    ]
    if (= $arg1 (findkeycode 3DS_TOUCH_SCREENSHOT)) [sleep 1000 qa_hid_finish 1]
]
onAttack = [echo AC3DS_QA PASS hid_fire $arg1]
onReload = [echo AC3DS_QA PASS hid_reload $arg1]
tempalias qa_hid_finish [echo AC3DS_QA END hid; quit]

// This file signals readiness to the host even while the log is buffered.
mapstartalways = [
    if (= $gamemode 8) [
        mapstartalways = []
        closecurmenu
        sleep 2500 [
            if (player1 alive) [
                echo AC3DS_QA HID_READY (curmap)
                screenshot qa_hid_ready
                sleep 45000 qa_hid_finish 1
            ] [echo AC3DS_QA FAIL hid_spawn; quit]
        ] 1
    ] [
        sleep 10 [mode 8; map ac_desert] 1
    ]
]
