echo AC3DS_QA BEGIN network
sleep 2000 [
    closecurmenu
    name AC3DSQA
    connect 127.0.0.1 28783
] 1
sleep 14000 [
    echo AC3DS_QA NETWORK_STATE $connected (curmap) $gamemode (player1 cn)
    if (&& $connected (>= (player1 cn) 0)) [
        echo AC3DS_QA PASS desktop_join
        say AC3DS_QA_LOOPBACK
    ] [ echo AC3DS_QA FAIL desktop_join ]
] 1
sleep 19500 [
    if $connected [ disconnect ]
    sleep 2000 [
        if (! $connected) [ echo AC3DS_QA PASS desktop_disconnect ] [ echo AC3DS_QA FAIL desktop_disconnect ]
        echo AC3DS_QA END network
        quit
    ] 1
] 1
sleep 30000 [ echo AC3DS_QA TIMEOUT network; quit ] 1
