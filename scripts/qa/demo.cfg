// Supply a genuine protocol-1300 demo at <test-profile>/demos/qa_demo.dmo.
echo AC3DS_QA BEGIN demo
sleep 2000 [
    closecurmenu
    echo AC3DS_QA DEMO_STATE (watchingdemo) (curmap) $gamemode
    if (watchingdemo) [ echo AC3DS_QA PASS demo_start ] [ echo AC3DS_QA FAIL demo_start ]
    rewind 1
    sleep 2000 [
        screenshot qa_demo
        stopdemo
        sleep 1000 [
            if (! (watchingdemo)) [ echo AC3DS_QA PASS demo_stop ] [ echo AC3DS_QA FAIL demo_stop ]
            echo AC3DS_QA END demo
            quit
        ] 1
    ] 1
] 1
sleep 30000 [ echo AC3DS_QA TIMEOUT demo; quit ] 1
