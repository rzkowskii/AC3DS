echo AC3DS_QA BEGIN venison
new_gfx_quality 4
waterreflect 1
waterrefract 1
reflectsize 7
tempalias qa_water_view [
    if (! (player1 alive)) [
        attack
        sleep 250 qa_water_view 1
    ] [
        edittoggle
        if $editing [
            echo AC3DS_QA CAMERA (gotoposition 203.5 180.5 6.5 136 -62)
            edittoggle
            addnbot 8 random good
            echo AC3DS_QA SCENE water_bots (curmap) $gamemode $waterreflect $waterrefract
            sleep 250 [screenshot qa_venison_water] 1
            sleep 1500 [ac3dsprofile 600] 1
        ] [ echo AC3DS_QA FAIL water_position; quit ]
    ]
]
sleep 1500 [
    closecurmenu
    mapstartonce = [
        sleep 1500 [
            if (&& (= $gamemode 8) (strcmp (curmap) ac_venison)) [
                qa_water_view
            ] [ echo AC3DS_QA FAIL water_bots; quit ]
        ] 1
    ]
    mode 8
    map ac_venison
] 1
sleep 210000 [echo AC3DS_QA TIMEOUT venison; quit] 1
