echo AC3DS_QA BEGIN audio
sleep 1500 [
    closecurmenu
    tempalias qa_map_status (loadmap ac_kazemat)
    if (&& (= $qa_map_status 0) (strcmp (curmap) ac_kazemat)) [
        echo AC3DS_QA PASS audio_kazemat_load
    ] [ echo AC3DS_QA FAIL audio_kazemat_load $qa_map_status; quit ]
    if (! $editing) [ edittoggle ]
    if (! $editing) [ echo AC3DS_QA FAIL audio_kazemat_position; quit ]
    // Stock spawn cube below the long helicopter ambience, near a wind source.
    gotoposition 196.5 207.5 5 292 0
    echo AC3DS_QA AUDIO_POSITION (player1 x) (player1 y) (player1 z)
    tempalias qa_before (ac3dsaudiostats)
    // Start the dwell on the next update, after synchronous map load time is applied.
    sleep 1 [
        sleep 5000 [
            tempalias qa_after (ac3dsaudiostats)
            if (> $qa_after $qa_before) [
                echo AC3DS_QA PASS audio_kazemat_playback
            ] [ echo AC3DS_QA FAIL audio_kazemat_playback $qa_before $qa_after ]
            echo AC3DS_QA END audio
            quit
        ] 1
    ] 1
] 1
