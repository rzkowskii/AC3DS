// Exercise the sniper controls through the normal lower-screen input path.
nextprimary sniper
showstats 0
bind 3DS_ZR [setscope 0]

tempalias qa_scope_assert [
    if $arg1 [echo AC3DS_QA PASS $arg2] [
        echo AC3DS_QA FAIL $arg2 (curweapon) (player1 scoping) (player1 magcontent)
        quit
    ]
]

tempalias qa_scope_wait_end [
    if (= $minutesremaining 0) [
        gamespeed 100
        qa_scope_assert (strcmp (curmenu) score) scope_intermission_scores
        qa_scope_assert (! (player1 scoping)) scope_intermission_clears
        ac3dsqabutton 3DS_R 600
        sleep 350 [
            qa_scope_assert (! (player1 scoping)) scope_intermission_blocks_r
            screenshot qa_scope_intermission
        ] 1
        sleep 950 [echo AC3DS_QA END scope; quit] 1
    ] [sleep 700 qa_scope_wait_end 1]
]

tempalias qa_scope_prepare_end [
    ac3dsqabutton 3DS_UP 180
    sleep 1000 [
        qa_scope_assert (&& (player1 alive) (= (curweapon) 5)) scope_intermission_sniper
        ac3dsqatouch 45 218 1 100 120
        sleep 500 [
            qa_scope_assert (player1 scoping) scope_intermission_latch_ready
            gamespeed 1000
            sleep 700 qa_scope_wait_end 1
        ] 1
    ] 1
]

tempalias qa_scope_run [
    qa_scope_assert (strcmp (keybind 3DS_TOUCH_SCOPE) ac3ds_scope_toggle) scope_binding
    bottomshot qa_scope_ready
    ac3dsqatouch 45 218 1 600 150
    sleep 270 [qa_scope_assert (! (player1 scoping)) scope_waits_for_release] 1
    sleep 950 [
        qa_scope_assert (player1 scoping) scope_touch_on
        bottomshot qa_scope_active
        screenshot qa_scope_top
        ac3dsqatouch 45 218 1 600 120
    ] 1
    sleep 1210 [ac3dsqatouch 90 218 1 150 120] 1
    sleep 1580 [
        qa_scope_assert (player1 scoping) scope_drag_cancel
        ac3dsqatouch 45 218 1 100 120
    ] 1
    sleep 2070 [
        qa_scope_assert (! (player1 scoping)) scope_touch_off
        ac3dsqabutton 3DS_R 650
    ] 1
    sleep 2340 [qa_scope_assert (player1 scoping) scope_hold_r] 1
    sleep 3000 [
        qa_scope_assert (! (player1 scoping)) scope_release_r
        ac3dsqatouch 45 218 1 100 120
    ] 1
    sleep 3500 [
        qa_scope_assert (player1 scoping) scope_reopened
        ac3dsqabutton 3DS_L 170
    ] 1
    sleep 5100 [
        qa_scope_assert (< (player1 magcontent) 5) scope_shot_fired
        ac3dsqabutton 3DS_X 130
    ] 1
    sleep 5620 [qa_scope_assert (! (player1 scoping)) scope_reload_clears] 1
    sleep 7800 [ac3dsqatouch 45 218 1 100 120] 1
    sleep 8270 [
        qa_scope_assert (player1 scoping) scope_after_reload
        ac3dsqabutton 3DS_DOWN 180
    ] 1
    sleep 9200 [
        qa_scope_assert (&& (= (curweapon) 1) (! (player1 scoping))) scope_switch_clears
        bottomshot qa_scope_pistol
        ac3dsqatouch 45 218 1 100 120
    ] 1
    sleep 9650 [
        qa_scope_assert (! (player1 scoping)) scope_absent_on_pistol
        qa_scope_prepare_end
    ] 1
]

tempalias qa_scope_drawer [
    ac3dsqatouch 11 20 1 100 120
    sleep 480 [
        bottomshot qa_scope_drawer
        ac3dsqatouch 45 218 1 100 120
    ] 1
    sleep 970 [
        qa_scope_assert (! (player1 scoping)) scope_drawer_blocks
        ac3dsqatouch 160 145 1 100 120
    ] 1
    sleep 1470 [ac3dsqatouch 45 218 1 100 120] 1
    sleep 1950 [
        qa_scope_assert (player1 scoping) scope_works_after_drawer
        ac3dsqatouch 45 218 1 100 120
    ] 1
    sleep 2430 qa_scope_run 1
]

tempalias qa_scope_explicit_off [
    ac3dsqatouch 45 218 1 100 120
    sleep 500 [
        qa_scope_assert (player1 scoping) scope_script_latch_ready
        ac3dsqabutton 3DS_ZR 170
    ] 1
    sleep 980 [
        qa_scope_assert (! (player1 scoping)) scope_script_clears_latch
        qa_scope_drawer
    ] 1
]

tempalias qa_scope_mixed_input [
    ac3dsqabutton 3DS_R 1600
    sleep 400 [ac3dsqatouch 45 218 1 100 120] 1
    sleep 920 [qa_scope_assert (player1 scoping) scope_latch_on_during_r] 1
    sleep 2000 [
        qa_scope_assert (player1 scoping) scope_latch_survives_r_release
        ac3dsqabutton 3DS_R 1600
    ] 1
    sleep 2400 [ac3dsqatouch 45 218 1 100 120] 1
    sleep 2910 [qa_scope_assert (player1 scoping) scope_latch_off_during_r] 1
    sleep 4000 [
        qa_scope_assert (! (player1 scoping)) scope_hold_release_after_unlatch
        qa_scope_explicit_off
    ] 1
]

tempalias qa_scope_script_reload [
    ac3dsqatouch 45 218 1 100 120
    sleep 500 [
        qa_scope_assert (player1 scoping) scope_before_script_reload
        exec config/scripts.cfg
        qa_scope_assert (player1 scoping) scope_after_script_reload
        ac3dsqabutton 3DS_R 450
    ] 1
    sleep 1280 [
        qa_scope_assert (player1 scoping) scope_script_reload_preserves_latch
        ac3dsqatouch 45 218 1 100 120
    ] 1
    sleep 1770 [
        qa_scope_assert (! (player1 scoping)) scope_script_reload_touch_off
        qa_scope_mixed_input
    ] 1
]

tempalias qa_scope_ready [
    if (&& (player1 alive) (= (curweapon) 5)) [qa_scope_script_reload] [
        ac3dsqabutton 3DS_L 180
        sleep 1400 qa_scope_ready 1
    ]
]

mapstartalways = [
    if (= $gamemode 8) [
        mapstartalways = []
        closecurmenu
        sleep 1800 qa_scope_ready 1
    ] [sleep 10 [mode 8; map ac_desert 1] 1]
]

sleep 90000 [echo AC3DS_QA TIMEOUT scope; quit] 1
