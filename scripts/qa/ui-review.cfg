showstats 0
hideconsole 1
hidehudmsgs 1
modeacronyms 1
idlebots 1
botsshoot 0

tempalias qa_ui_servers [
    showallservers 1
    showonlygoodservers 0
    loop qa_host 300 [
        addserver (concatword "127.0." (div $qa_host 100) "." (+ (mod $qa_host 100) 1)) 29765
    ]
    showmenu server
    sleep 550 [
        screenshot qa_servers_first
        menuselection server 285
        sleep 600 [
            if (! (strcmp (curmenu) server)) [echo AC3DS_QA FAIL ui_server_browser; quit]
            screenshot qa_servers_after_256
            bottomshot qa_servers_card
            echo AC3DS_QA PASS ui_server_browser
            echo AC3DS_QA END ui-review
            quit
        ] 1
    ] 1
]

tempalias qa_ui_outcome [
    if (= $minutesremaining 0) [
        gamespeed 100
        showscores 1
        sleep 400 [
            if (! (strcmp (curmenu) score)) [echo AC3DS_QA FAIL ui_outcome; quit]
            screenshot qa_score_outcome
            echo AC3DS_QA PASS ui_outcome
            showscores 0
            sleep 250 qa_ui_servers 1
        ] 1
    ] [sleep 750 qa_ui_outcome 1]
]

tempalias qa_ui_admin [
    addbot CLA good ReviewBot
    sleep 500 [
        showmenu [force team]
        sleep 480 [ac3dsqatouch 80 45 1 1050 120] 1
        sleep 830 [kickallbots; addbot CLA good ReviewBot] 1
        sleep 1940 [
            if (! (strcmp (curmenu) [force team])) [echo AC3DS_QA FAIL ui_admin_stale; quit]
            echo AC3DS_QA PASS ui_admin_stale
            ac3dsqatouch 80 45 1 130 120
        ] 1
        sleep 2440 [
            if (strcmp (curmenu) [force team]) [echo AC3DS_QA FAIL ui_admin_fresh; quit]
            echo AC3DS_QA PASS ui_admin_fresh
            kickallbots
            gamespeed 1000
            sleep 47000 qa_ui_outcome 1
        ] 1
    ] 1
]

tempalias qa_ui_reference [
    showmenu reference
    sleep 750 [ac3dsqatouch 80 45 1 700 120] 1
    sleep 1040 [
        if (! (strcmp (curmenu) reference)) [echo AC3DS_QA FAIL ui_reference_hold; quit]
        echo AC3DS_QA PASS ui_reference_hold
    ] 1
    sleep 1870 [
        if (! (strcmp (curmenu) CubeScript)) [echo AC3DS_QA FAIL ui_reference_release; quit]
        echo AC3DS_QA PASS ui_reference_release
        bottomshot qa_reference_section
        loop qa_close 3 [closecurmenu]
        qa_ui_admin
    ] 1
]

mapstartalways = [
    if (= $gamemode 7) [
        mapstartalways = []
        closecurmenu
        sleep 2100 qa_ui_reference 1
    ] [sleep 10 [mode 7; map ac_desert2 1] 1]
]
sleep 95000 [echo AC3DS_QA TIMEOUT ui-review; quit] 1
