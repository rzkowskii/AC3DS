// Give each scene its own measurement window after map load.
echo AC3DS_QA BEGIN performance
new_gfx_quality 4
mapstartonce = [
    sleep 2500 [
        closecurmenu
        echo AC3DS_QA SCENE baseline (curmap) $gamemode
        ac3dsprofile 600
        sleep 18000 qa_team_bots 1
    ] 1
]
tempalias qa_team_bots [
    mapstartonce = [
        sleep 2500 [
            addnbot 3 CLA good
            addnbot 3 RVSF good
            echo AC3DS_QA SCENE team_bots (curmap) $gamemode
            ac3dsprofile 600
            sleep 30000 qa_water_bots 1
        ] 1
    ]
    mode 7
    map ac_desert
]
tempalias qa_water_bots [
    waterreflect 1
    waterrefract 1
    reflectsize 7
    mapstartonce = [
        sleep 2500 [
            // Stand at a stock spawn looking across the water basin.
            edittoggle
            if $editing [
                echo AC3DS_QA CAMERA (gotoposition 203.5 180.5 6.5 136 -62)
                edittoggle
            ] [echo AC3DS_QA FAIL water_position; quit]
            addnbot 8 random good
            echo AC3DS_QA SCENE water_bots (curmap) $gamemode
            ac3dsprofile 600
            sleep 45000 [
                ac3dsstats
                screenshot qa_water
                echo AC3DS_QA END performance
                quit
            ] 1
        ] 1
    ]
    mode 8
    map ac_venison
]
sleep 230000 [echo AC3DS_QA TIMEOUT performance; quit] 1
