// Drive the native touch dispatch against the lower-screen coordinates.
screenshottype 2
screenshotscale 1
showscoresondeath 1
nextprimary assault

tempalias qa_picker_assert [
    if $arg1 [echo AC3DS_QA PASS $arg2] [
        echo AC3DS_QA FAIL $arg2 (curmenu) (player1 primary) (curweapon) $nextprimary
        quit
    ]
]

tempalias qa_picker_forced [
    qa_picker_assert (&& (= $gamemode 18) (= (player1 primary) 1)) picker_pistol_mode
    ac3dsqatouch 270 22 1 100 120
    sleep 450 [
        qa_picker_assert (strcmp (curmenu) Weapons) picker_forced_open
        bottomshot qa_weapon_forced
        ac3dsqatouch 80 198 1 100 120
    ] 1
    sleep 900 [
        qa_picker_assert (&& (strcmp $nextprimary carbine) (= (player1 primary) 1)) picker_forced_preference
        delmenu Weapons
        newmenu Weapons
        menutitle "Custom weapons"
        menuitem "First action" [echo AC3DS_QA PASS picker_custom_menu]
        menuitem "Second action" -1
        menuitem "Third action" -1
        menuitem "Fourth action" -1
        menuitem "Fifth action" -1
        showmenu Weapons
        sleep 450 [
            bottomshot qa_weapon_custom
            ac3dsqatouch 78 45 1 100 120
        ] 1
        sleep 950 [echo AC3DS_QA END weapon-picker; quit] 1
    ] 1
]

newmenu "Picker parent"
menuitem "Close" [closecurmenu]

tempalias qa_picker_run [
    qa_picker_assert (player1 alive) picker_loaded
    ac3dsqatouch 270 22 1 550 150
    sleep 350 [qa_picker_assert (strcmp (curmenu) Weapons) picker_hud_opens] 1
    sleep 750 [bottomshot qa_weapon_picker; ac3dsqatouch 238 142 1 750 120] 1
    sleep 1020 [
        qa_picker_assert (&& (strcmp (curmenu) Weapons) (strcmp $nextprimary assault)) picker_waits_for_release
        bottomshot qa_weapon_held
        ac3dsqatouch 160 142 1 150 120
    ] 1
    sleep 1430 [
        qa_picker_assert (&& (strcmp (curmenu) Weapons) (strcmp $nextprimary assault)) picker_drag_cancels
        ac3dsqatouch 238 142 1 100 120
    ] 1
    sleep 1840 [
        qa_picker_assert (&& (strcmp $nextprimary shotgun) (= (curweapon) 6)) picker_saves_on_release
        qa_picker_assert (strcmp (curmenu) "") picker_direct_returns_to_match
        showmenu [Picker parent]
        showmenu Weapons
    ] 1
    sleep 2260 [
        bottomshot qa_weapon_saved
        ac3dsqabutton 3DS_UP 180
    ] 1
    sleep 2600 [bottomshot qa_weapon_focus; ac3dsqabutton 3DS_A 180] 1
    sleep 3010 [
        qa_picker_assert (&& (strcmp (curmenu) [Picker parent]) (strcmp $nextprimary subgun)) picker_returns_to_parent
        closecurmenu
        suicide
    ] 1
    sleep 3610 [
        qa_picker_assert (&& (! (player1 alive)) (strcmp (curmenu) score)) picker_death_scoreboard
        ac3dsqatouch 270 22 1 100 120
    ] 1
    sleep 4090 [
        qa_picker_assert (strcmp (curmenu) Weapons) picker_open_while_dead
        ac3dsqatouch 238 202 1 100 120
    ] 1
    sleep 4570 [
        qa_picker_assert (&& (strcmp (curmenu) "") (strcmp $nextprimary subgun)) picker_back_keeps_choice
    ] 1
    sleep 6070 [ac3dsqabutton 3DS_L 200] 1
    sleep 6600 [
        qa_picker_assert (&& (player1 alive) (= (player1 primary) 4)) picker_respawn_equips
        mapstartonce = [sleep 1150 qa_picker_forced 1]
        mode 18
        map ac_desert
    ] 1
]

tempalias qa_picker_ready [
    if (player1 alive) [qa_picker_run] [
        ac3dsqabutton 3DS_L 180
        sleep 1200 qa_picker_ready 1
    ]
]

mapstartalways = [
    if (= $gamemode 8) [
        mapstartalways = []
        closecurmenu
        sleep 1500 qa_picker_ready 1
    ] [sleep 10 [mode 8; map ac_desert] 1]
]

sleep 45000 [echo AC3DS_QA FAIL picker_timeout; quit] 1
