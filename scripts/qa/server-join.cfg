// The loopback responders provide two matching, password-protected servers.
hideconsole 1
hidehudmsgs 1
showstats 0
servpingrate 1000
showonlygoodservers 0
serversort 7
serversortdir 0

tempalias qa_join_matches [
    addserver 127.0.0.1 29691
    addserver 127.0.0.1 29694
    searchnickname MatchQA
]

tempalias qa_join_remove [
    closecurmenu
    searchnickname MatchQA
    sleep 1400 [menuselection search 0] 1
    sleep 1900 [ac3dsqatouch 160 124 1 1150 120] 1
    sleep 2210 [clearservers; addserver 127.0.0.1 29691; refreshcurmenu] 1
    sleep 2750 [bottomshot qa_join_after_removal] 1
    sleep 3460 [
        if (! (strcmp (curmenu) search)) [echo AC3DS_QA FAIL join_removed_target; quit]
        echo AC3DS_QA PASS join_removed_target
        echo AC3DS_QA END server-join
        quit
    ] 1
]

tempalias qa_join_player_row [
    closecurmenu
    searchnickname MatchQA
    sleep 1250 [menuselection search 0; ac3dsqabutton 3DS_DOWN 120] 1
    sleep 1730 [ac3dsqatouch 160 124 1 170 120] 1
    sleep 2330 [
        if (! (&& (strcmp (curmenu) [password required]) (= $sbport 29694))) [
            echo AC3DS_QA FAIL join_player_row (curmenu) $sbport
            quit
        ]
        echo AC3DS_QA PASS join_player_row
        qa_join_remove
    ] 1
]

tempalias qa_join_reorder [
    menuselection search 0
    sleep 540 [
        bottomshot qa_join_before_sort
        ac3dsqatouch 160 124 1 1300 120
        sleep 400 [serversortdir 1] 1
        sleep 870 [bottomshot qa_join_after_sort] 1
    ] 1
    sleep 2410 [
        if (! (&& (strcmp (curmenu) [password required]) (= $sbport 29691))) [
            echo AC3DS_QA FAIL join_preserves_target (curmenu) $sbport
            quit
        ]
        echo AC3DS_QA PASS join_preserves_target
        qa_join_player_row
    ] 1
]

sleep 3300 [
    closecurmenu
    qa_join_matches
    sleep 5000 qa_join_reorder 1
] 1
sleep 45000 [echo AC3DS_QA TIMEOUT server-join; quit] 1
